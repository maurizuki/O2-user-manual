title: O2 User Manual
description: User manual for O2, a safe and flexible archive for personal data.
theme: just-the-docs

url: https://maurizuki.github.io/O2-user-manual

aux_links:
  O2 home page: https://maurizuki.github.io/O2
  O2 on GitHub: https://github.com/maurizuki/O2

favicon_ico: "/assets/favicon.png"

# Pages without an explicit layout (all but the home page) use the theme's default layout.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

color_scheme: dark

search_enabled: true
heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "O2 is open source software released under the Mozilla Public License 2.0."

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
