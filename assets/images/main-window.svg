<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc">
  <title id="title">O2 main window</title>
  <desc id="desc">Wireframe of the O2 main window: (1) the toolbar at the top; (2) the objects list and (3) the details tabs on the left, one above the other; (4) the search pane on the right; (5) the status bar at the bottom.</desc>
  <style>
    .chrome { fill: #3a3941; }
    .pane { fill: #2e2d34; }
    .line { stroke: #8a8892; stroke-width: 1; fill: none; }
    .frame { stroke: #a3a1aa; stroke-width: 1.5; }
    .box { fill: #2e2d34; stroke: #8a8892; stroke-width: 1; }
    .btn { fill: #45444d; stroke: #8a8892; stroke-width: 1; }
    .ph { fill: #57555f; }
    .sel { fill: #2c84fa; fill-opacity: 0.35; }
    .grip { fill: #a3a1aa; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #e6e1e8; }
    .muted { fill: #b5b2bc; font-size: 12px; }
    .hint { fill: #b5b2bc; font-size: 12px; font-style: italic; }
    .badge { fill: #2c84fa; }
    .badge-text { fill: #ffffff; font-size: 12px; font-weight: 700; text-anchor: middle; }
  </style>

  <!-- Window frame and title bar (no OS-specific controls) -->
  <rect x="8" y="8" width="784" height="524" rx="10" class="chrome"/>
  <text x="24" y="29" font-weight="600">O2</text>
  <line x1="8" y1="40" x2="792" y2="40" class="line"/>

  <!-- 1. Toolbar -->
  <g>
    <rect x="20" y="50" width="66" height="28" rx="4" class="btn"/>
    <text x="30" y="69">New</text><line x1="68" y1="54" x2="68" y2="74" class="line"/><text x="72" y="68" class="muted">▾</text>
    <rect x="92" y="50" width="70" height="28" rx="4" class="btn"/>
    <text x="102" y="69">Open</text><line x1="144" y1="54" x2="144" y2="74" class="line"/><text x="148" y="68" class="muted">▾</text>
    <rect x="168" y="50" width="70" height="28" rx="4" class="btn"/>
    <text x="178" y="69">Save</text><line x1="220" y1="54" x2="220" y2="74" class="line"/><text x="224" y="68" class="muted">▾</text>
    <rect x="244" y="50" width="52" height="28" rx="4" class="btn"/>
    <text x="270" y="69" text-anchor="middle">Print</text>
    <rect x="302" y="50" width="52" height="28" rx="4" class="btn"/>
    <text x="328" y="69" text-anchor="middle">Tools</text>
    <rect x="360" y="50" width="52" height="28" rx="4" class="btn"/>
    <text x="386" y="69" text-anchor="middle">View</text>
    <rect x="418" y="50" width="66" height="28" rx="4" class="btn"/>
    <text x="428" y="69">Find</text><line x1="466" y1="54" x2="466" y2="74" class="line"/><text x="470" y="68" class="muted">▾</text>
    <rect x="490" y="50" width="52" height="28" rx="4" class="btn"/>
    <text x="516" y="69" text-anchor="middle">Help</text>
  </g>
  <line x1="8" y1="88" x2="792" y2="88" class="line"/>

  <!-- 2. Objects list -->
  <rect x="8" y="88" width="588" height="212" class="pane"/>
  <line x1="8" y1="112" x2="596" y2="112" class="line"/>
  <line x1="230" y1="88" x2="230" y2="112" class="line"/>
  <line x1="470" y1="88" x2="470" y2="112" class="line"/>
  <text x="18" y="105">Name</text>
  <text x="240" y="105">Tags</text>
  <text x="480" y="105">Next event</text>
  <rect x="8" y="138" width="588" height="26" class="sel"/>
  <g class="ph">
    <rect x="18" y="121" width="120" height="8" rx="4"/><rect x="240" y="121" width="90" height="8" rx="4"/><rect x="480" y="121" width="70" height="8" rx="4"/>
    <rect x="18" y="147" width="150" height="8" rx="4"/><rect x="240" y="147" width="140" height="8" rx="4"/>
    <rect x="18" y="173" width="96" height="8" rx="4"/><rect x="240" y="173" width="60" height="8" rx="4"/><rect x="480" y="173" width="70" height="8" rx="4"/>
    <rect x="18" y="199" width="134" height="8" rx="4"/><rect x="240" y="199" width="110" height="8" rx="4"/>
    <rect x="18" y="225" width="108" height="8" rx="4"/><rect x="240" y="225" width="80" height="8" rx="4"/><rect x="480" y="225" width="70" height="8" rx="4"/>
    <rect x="18" y="251" width="142" height="8" rx="4"/><rect x="240" y="251" width="124" height="8" rx="4"/>
    <rect x="18" y="277" width="88" height="8" rx="4"/><rect x="240" y="277" width="70" height="8" rx="4"/>
  </g>

  <!-- Horizontal splitter -->
  <line x1="8" y1="300" x2="596" y2="300" class="line"/>
  <line x1="8" y1="308" x2="596" y2="308" class="line"/>
  <circle cx="294" cy="304" r="1.5" class="grip"/><circle cx="302" cy="304" r="1.5" class="grip"/><circle cx="310" cy="304" r="1.5" class="grip"/>

  <!-- 3. Details tabs -->
  <rect x="16" y="340" width="572" height="152" class="box"/>
  <rect x="80" y="318" width="60" height="22" rx="3" class="btn"/>
  <text x="110" y="334" text-anchor="middle">Notes</text>
  <rect x="142" y="318" width="80" height="22" rx="3" class="btn"/>
  <text x="182" y="334" text-anchor="middle">Relations</text>
  <rect x="224" y="318" width="56" height="22" rx="3" class="btn"/>
  <text x="252" y="334" text-anchor="middle">Rules</text>
  <path d="M16 340 V318 a3 3 0 0 1 3 -3 H75 a3 3 0 0 1 3 3 V340" class="box"/>
  <line x1="17" y1="340" x2="77" y2="340" stroke="#2e2d34" stroke-width="2"/>
  <text x="47" y="333" text-anchor="middle" font-weight="600">Fields</text>
  <line x1="16" y1="362" x2="588" y2="362" class="line"/>
  <line x1="200" y1="340" x2="200" y2="362" class="line"/>
  <text x="26" y="356">Field</text>
  <text x="210" y="356">Value</text>
  <g class="ph">
    <rect x="26" y="370" width="80" height="8" rx="4"/><rect x="210" y="370" width="160" height="8" rx="4"/>
    <rect x="26" y="394" width="64" height="8" rx="4"/><rect x="210" y="394" width="120" height="8" rx="4"/>
    <rect x="26" y="442" width="96" height="8" rx="4"/><rect x="210" y="442" width="190" height="8" rx="4"/>
    <rect x="26" y="466" width="72" height="8" rx="4"/><rect x="210" y="466" width="100" height="8" rx="4"/>
    <rect x="26" y="418" width="70" height="8" rx="4"/>
  </g>
  <text x="210" y="426" class="muted" letter-spacing="2">●●●●●●●●</text>

  <!-- Vertical splitter -->
  <line x1="596" y1="88" x2="596" y2="500" class="line"/>
  <line x1="604" y1="88" x2="604" y2="500" class="line"/>
  <circle cx="600" cy="286" r="1.5" class="grip"/><circle cx="600" cy="294" r="1.5" class="grip"/><circle cx="600" cy="302" r="1.5" class="grip"/>

  <!-- 4. Search pane -->
  <rect x="604" y="88" width="188" height="412" class="pane"/>
  <text x="616" y="112">Find by name:</text>
  <rect x="616" y="120" width="164" height="24" rx="3" class="box"/>
  <text x="616" y="166">Find by event:</text>
  <rect x="616" y="174" width="164" height="24" rx="3" class="box"/>
  <line x1="760" y1="174" x2="760" y2="198" class="line"/>
  <text x="764" y="191" class="muted">▾</text>
  <text x="616" y="220">Find by tag:</text>
  <rect x="616" y="228" width="164" height="106" rx="3" class="box"/>
  <g class="ph">
    <rect x="626" y="240" width="70" height="8" rx="4"/><rect x="626" y="262" width="96" height="8" rx="4"/>
    <rect x="626" y="284" width="58" height="8" rx="4"/><rect x="626" y="306" width="84" height="8" rx="4"/>
  </g>
  <text x="616" y="356">Find by rule:</text>
  <rect x="616" y="364" width="164" height="106" rx="3" class="box"/>
  <g class="ph">
    <rect x="626" y="376" width="104" height="8" rx="4"/><rect x="626" y="398" width="76" height="8" rx="4"/>
    <rect x="626" y="420" width="92" height="8" rx="4"/>
  </g>

  <!-- 5. Status bar -->
  <line x1="8" y1="500" x2="792" y2="500" class="line"/>
  <line x1="158" y1="506" x2="158" y2="526" class="line"/>
  <text x="20" y="521" class="hint">Item count</text>
  <text x="170" y="521" class="hint">File name, or selected object and its tags</text>

  <!-- Window outline on top of the panes -->
  <rect x="8" y="8" width="784" height="524" rx="10" fill="none" class="frame"/>

  <!-- Area callouts -->
  <g>
    <circle cx="774" cy="64" r="11" class="badge"/><text x="774" y="68" class="badge-text">1</text>
    <circle cx="578" cy="282" r="11" class="badge"/><text x="578" y="286" class="badge-text">2</text>
    <circle cx="576" cy="328" r="11" class="badge"/><text x="576" y="332" class="badge-text">3</text>
    <circle cx="774" cy="486" r="11" class="badge"/><text x="774" y="490" class="badge-text">4</text>
    <circle cx="774" cy="516" r="11" class="badge"/><text x="774" y="520" class="badge-text">5</text>
  </g>
</svg>
